<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SkyMP Heavy RP - UI (VOIP only)</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: transparent;
      color: white;
    }

    /* === VOIP HUD === */
    #voip-hud {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }
    .voip-peer {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 4px 12px 4px 8px;
      font-size: 13px;
      transition: opacity 0.3s;
    }
    .voip-peer .icon {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 1.2s infinite;
    }
    .voip-peer.muted .icon { background: #e53935; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .voip-peer .vol-bar {
      width: 50px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    .voip-peer .vol-fill {
      height: 100%;
      background: #4caf50;
      transition: width 0.4s;
    }

    /* === STATUS: bolinha verde no canto superior esquerdo === */
    #voip-status {
      position: fixed;
      top: 14px;
      left: 14px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    #voip-status.visible { display: flex; }

    #voip-status .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 6px rgba(76,175,80,0.8);
    }

    /* Barra de 3 níveis (alcance: sussurro / normal / grito) */
    #voip-range-bar {
      display: flex;
      gap: 3px;
      align-items: flex-end;
    }
    #voip-range-bar .range-segment {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: rgba(255,255,255,0.18);
      transition: background 0.15s, height 0.15s;
    }
    #voip-range-bar .range-segment:nth-child(2) { height: 12px; }
    #voip-range-bar .range-segment:nth-child(3) { height: 16px; }
    #voip-range-bar .range-segment.active:nth-child(1) { background: #4caf50; }
    #voip-range-bar .range-segment.active:nth-child(2) { background: #fdd835; }
    #voip-range-bar .range-segment.active:nth-child(3) { background: #e53935; }

    /* === POP-UP: acesso encerrado (ban / whitelist) === */
    #access-revoked {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.72);
      z-index: 10000;
    }
    #access-revoked.visible { display: flex; }
    #access-revoked .panel {
      width: min(460px, calc(100vw - 48px));
      padding: 28px 28px 24px;
      border-radius: 10px;
      border: 1px solid rgba(229,57,53,0.55);
      background: rgba(12,12,15,0.96);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    #access-revoked h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ef5350;
      margin-bottom: 12px;
    }
    #access-revoked p {
      font-size: 15px;
      line-height: 1.5;
      color: #f5f1e8;
      margin-bottom: 8px;
      word-wrap: break-word;
    }
    #access-revoked .hint {
      font-size: 12px;
      color: rgba(245,241,232,0.6);
      margin-bottom: 20px;
    }
    #access-revoked button {
      padding: 10px 36px;
      border: none;
      border-radius: 6px;
      background: #e53935;
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    #access-revoked button:hover { background: #f4511e; }

    /* === POP-UP: conexão com o servidor perdida === */
    #server-down {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.72);
      z-index: 9999;
    }
    #server-down.visible { display: flex; }
    #server-down .panel {
      width: min(460px, calc(100vw - 48px));
      padding: 28px 28px 24px;
      border-radius: 10px;
      border: 1px solid rgba(187,161,107,0.55);
      background: rgba(12,12,15,0.96);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    #server-down h1 {
      font-size: 20px;
      font-weight: 700;
      color: #e0c388;
      margin-bottom: 12px;
    }
    #server-down p {
      font-size: 15px;
      line-height: 1.5;
      color: #f5f1e8;
      margin-bottom: 20px;
      min-height: 22px;
    }
    #server-down .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    #server-down button {
      padding: 10px 28px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    #server-down button:disabled { opacity: 0.55; cursor: default; }
    #server-down-reconnect { background: #3c8c5a; }
    #server-down-reconnect:hover:not(:disabled) { background: #46a068; }
    #server-down-close { background: #5a5a60; }
    #server-down-close:hover:not(:disabled) { background: #6c6c73; }

<script>
  if (typeof mp === 'undefined') {
    window.mp = {
      trigger: (ev, data) => console.log('[mock] trigger:', ev, data),
      events: { add: (ev, cb) => console.log('[mock] event registered:', ev) }
    };
  }

  const state = {
    actorId: null,
    muted: false,
    talking: false,
    voiceMode: 'normal',
    peers: new Map(),
    ws: null,
    voiceFatal: false,
    relayPeers: new Map(),
    peerPositions: new Map(), // actorId -> [x, y, z] de quem fala (proximity_update)
    relayHeard: false,
    audioCtx: null,
    localStream: null
  };

  function normalizePayload(data) {
    if (!data) return {};
    if (typeof data === 'string') {
      try { return JSON.parse(data); } catch { return {}; }
    }
    return data;
  }

  function sendUiEvent(type, data) {
    if (typeof window.skyrimPlatform === 'undefined' ||
        typeof window.skyrimPlatform.sendMessage !== 'function') {
      return;
    }
    window.skyrimPlatform.sendMessage('cef::ui:event', type, data || {});
  }

  // function sendChatCommand(command) {
  //   if (!command) return;
  //   sendUiEvent('cef::chat:send', command);
  // }

  // const CHAT_LOG_MAX_LINES = 40;
  // const CHAT_LOG_FADE_AFTER_MS = 18000;
  // const CHAT_LOG_REMOVE_AFTER_MS = 1200;

  // function showInteractionToast(message) {
  //   const log = document.getElementById('chat-log');
  //   if (!log || !message) return;

  //   const line = document.createElement('div');
  //   line.className = 'chat-line';
  //   line.textContent = message;
  //   log.appendChild(line);

  //   while (log.children.length > CHAT_LOG_MAX_LINES) {
  //     log.removeChild(log.firstChild);
  //   }

  //   setTimeout(() => {
  //     line.classList.add('fade');
  //     setTimeout(() => line.remove(), CHAT_LOG_REMOVE_AFTER_MS);
  //   }, CHAT_LOG_FADE_AFTER_MS);
  // }

  // Reconexão do listener. Antes, uma queda (rede, servidor reiniciado, ticket
  // recusado) deixava a pessoa surda até relogar. Ticket é de uso único, então
  // reconectar = pedir um novo ao servidor; o backoff evita martelar o servidor
  // se o problema for persistente.
  const RECONNECT_BASE_MS = 2000;
  const RECONNECT_MAX_MS = 30000;
  let _reconnectAttempts = 0;
  let _reconnectTimer = null;

  function scheduleReconnect() {
    if (_reconnectTimer) return;
    const delay = Math.min(RECONNECT_MAX_MS, RECONNECT_BASE_MS * Math.pow(2, _reconnectAttempts));
    _reconnectAttempts++;
    _reconnectTimer = setTimeout(() => {
      _reconnectTimer = null;
      sendUiEvent('cef::voip:reconnect', {});
    }, delay);
  }

  function connectVoip(actorId, ticket, host, port) {
    state.actorId = actorId;
    state.voiceFatal = false;
    state.relayHeard = false;

    // Um ticket novo substitui a conexão atual. Sem fechar a antiga, ela ficava
    // pendurada e o `onclose` dela dispararia uma reconexão à toa.
    const previous = state.ws;
    if (previous) {
      previous.onclose = null;
      try { previous.close(); } catch { /* já fechada */ }
    }

    const wsUrl = `ws://${host || '127.0.0.1'}:${port || 7778}`;
    const ws = new WebSocket(wsUrl);
    state.ws = ws;

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'auth', actorId, ticket }));
    };

    ws.onmessage = async (e) => {
      const msg = JSON.parse(e.data);
      await handleSignal(msg);
    };

    ws.onerror = () => {};

    ws.onclose = () => {
      if (state.ws !== ws) return;
      state.ws = null;
      scheduleReconnect();
    };
  }

  async function handleSignal(msg) {
    switch (msg.type) {
      case 'auth_ok':
        _reconnectAttempts = 0;
        // O servidor pode ter criado a entrada do zero (reconexão depois de
        // cair tudo): sem reenviar, a barra mostraria sussurro/grito e o
        // servidor estaria em normal — a tecla N "não funcionaria".
        sendSignal({ type: 'voice_mode', mode: state.voiceMode });
        sendSignal({ type: 'ptt', talking: state.talking });
        updateRangeBar();
        break;

      case 'auth_failed':
        // Ticket velho/expirado: o `onclose` que vem em seguida pede outro.
        state.voiceFatal = true;
        if (state.ws) state.ws.close();
        break;

      case 'proximity_update':
        for (const p of msg.peers) {
          if (!state.peers.has(p.actorId)) {
            await initiateCall(p.actorId);
          }
          const peer = state.peers.get(p.actorId);
          if (peer && peer.gainNode) {
            peer.gainNode.gain.setTargetAtTime(p.volume, state.audioCtx.currentTime, 0.1);
          }
          updatePeerHUD(p.actorId, p.volume, false);
          if (Array.isArray(p.pos)) {
            state.peerPositions.set(p.actorId, p.pos);
            setPannerPosition(state.relayPeers.get(p.actorId), p.pos);
          }
        }
        for (const [id] of state.peers) {
          if (!msg.peers.find(p => p.actorId === id)) {
            removePeer(id);
          }
        }
        for (const [id] of state.relayPeers) {
          if (!msg.peers.find(p => p.actorId === id)) {
            removeRelayPeer(id);
            removePeerHUD(id);
          }
        }
        break;

      case 'offer':
        await handleOffer(msg.fromActorId, msg.sdp);
        break;

      case 'answer':
        if (state.peers.has(msg.fromActorId)) {
          await state.peers.get(msg.fromActorId).pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
        }
        break;

      case 'ice':
        if (state.peers.has(msg.fromActorId)) {
          await state.peers.get(msg.fromActorId).pc.addIceCandidate(msg.candidate);
        }
        break;

      case 'audio_frame':
        playRelayFrame(msg.fromActorId, msg.volume, msg.data, msg.mode);
        break;

      case 'peer_left':
        removePeer(msg.actorId);
        break;
    }
  }

  const RELAY_SAMPLE_RATE = 48000;
  const RELAY_JITTER_S = 0.06;
  const RELAY_MAX_QUEUE_S = 0.5;

  function ensureAudioContext() {
    if (!state.audioCtx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      state.audioCtx = new Ctor({ sampleRate: RELAY_SAMPLE_RATE });
    }
    if (state.audioCtx.state === 'suspended') state.audioCtx.resume().catch(() => {});
    return state.audioCtx;
  }

  // ── efeito de grito ─────────────────────────────────────────────────────
  // Voz gritada = menos grave, mais "esforço" na faixa de 2-3 kHz, aspereza
  // (saturação leve), dinâmica achatada e um eco curto de voz que ecoa longe.
  const SHOUT_HIGHPASS_HZ = 200;
  const SHOUT_PRESENCE_HZ = 2600;
  const SHOUT_PRESENCE_DB = 6;
  const SHOUT_DRIVE = 3;
  const SHOUT_ECHO_S = 0.11;
  const SHOUT_ECHO_FEEDBACK = 0.22;
  const SHOUT_ECHO_MIX = 0.25;
  const FX_SWITCH_S = 0.05; // troca suave limpo<->grito, sem estalo

  function saturationCurve(drive) {
    const n = 2048;
    const curve = new Float32Array(n);
    const norm = Math.tanh(drive);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(drive * x) / norm;
    }
    return curve;
  }

  /** input -> [efeitos de grito] -> output. */
  function createShoutFx(ctx) {
    const highpass = ctx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = SHOUT_HIGHPASS_HZ;

    const presence = ctx.createBiquadFilter();
    presence.type = 'peaking';
    presence.frequency.value = SHOUT_PRESENCE_HZ;
    presence.Q.value = 1;
    presence.gain.value = SHOUT_PRESENCE_DB;

    const shaper = ctx.createWaveShaper();
    shaper.curve = saturationCurve(SHOUT_DRIVE);
    shaper.oversample = '2x';

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -24;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.15;

    const output = ctx.createGain();
    output.gain.value = 0.9;

    const delay = ctx.createDelay(1);
    delay.delayTime.value = SHOUT_ECHO_S;
    const feedback = ctx.createGain();
    feedback.gain.value = SHOUT_ECHO_FEEDBACK;
    const echoMix = ctx.createGain();
    echoMix.gain.value = SHOUT_ECHO_MIX;

    highpass.connect(presence).connect(shaper).connect(comp);
    comp.connect(output);
    comp.connect(delay);
    delay.connect(feedback).connect(delay);
    delay.connect(echoMix).connect(output);

    return { input: highpass, output };
  }

  // ── som espacial ────────────────────────────────────────────────────────
  // Coordenadas do Skyrim (x leste, y norte, z cima) para as do Web Audio
  // (x direita, y cima, -z frente). A distância quem aplica é o servidor
  // (volume); o panner só dá a DIREÇÃO, por isso rolloffFactor 0.
  function toAudioSpace(pos) {
    return [pos[0], pos[2], -pos[1]];
  }

  function setAudioParam(param, value, ctx) {
    if (param && typeof param.setTargetAtTime === 'function') {
      param.setTargetAtTime(value, ctx.currentTime, 0.05);
    }
  }

  function createPanner(ctx) {
    const panner = ctx.createPanner();
    panner.panningModel = 'HRTF';
    panner.distanceModel = 'linear';
    panner.rolloffFactor = 0;
    panner.refDistance = 1;
    panner.maxDistance = 100000;
    return panner;
  }

  function setPannerPosition(chain, pos) {
    if (!chain || !Array.isArray(pos) || pos.length < 3) return;
    const ctx = ensureAudioContext();
    const [x, y, z] = toAudioSpace(pos);
    if (chain.panner.positionX) {
      setAudioParam(chain.panner.positionX, x, ctx);
      setAudioParam(chain.panner.positionY, y, ctx);
      setAudioParam(chain.panner.positionZ, z, ctx);
    } else {
      chain.panner.setPosition(x, y, z);
    }
  }

  // Posição e ângulo do PRÓPRIO jogador, empurrados pelo plugin do jogo a cada
  // 100ms (VoiceSpatialService). Virar o personagem muda o lado da voz na
  // hora, sem esperar o servidor. angleDeg: 0 = norte, 90 = leste.
  function setListenerPose(x, y, z, angleDeg) {
    const ctx = ensureAudioContext();
    const listener = ctx.listener;
    const [lx, ly, lz] = toAudioSpace([x, y, z]);
    const rad = angleDeg * Math.PI / 180;
    const [fx, fy, fz] = toAudioSpace([Math.sin(rad), Math.cos(rad), 0]);
    if (listener.positionX) {
      setAudioParam(listener.positionX, lx, ctx);
      setAudioParam(listener.positionY, ly, ctx);
      setAudioParam(listener.positionZ, lz, ctx);
      setAudioParam(listener.forwardX, fx, ctx);
      setAudioParam(listener.forwardY, fy, ctx);
      setAudioParam(listener.forwardZ, fz, ctx);
      setAudioParam(listener.upX, 0, ctx);
      setAudioParam(listener.upY, 1, ctx);
      setAudioParam(listener.upZ, 0, ctx);
    } else {
      listener.setPosition(lx, ly, lz);
      listener.setOrientation(fx, fy, fz, 0, 1, 0);
    }
  }
  window.setListenerPose = setListenerPose;

  /**
   * Cadeia por jogador que fala:
   *   fontes -> input -> (limpo | efeito de grito) -> panner (direção) -> gainNode (volume) -> saída
   */
  function getRelayChain(actorId) {
    let chain = state.relayPeers.get(actorId);
    if (!chain) {
      const ctx = ensureAudioContext();
      const input = ctx.createGain();
      const dry = ctx.createGain();
      const wet = ctx.createGain();
      wet.gain.value = 0;
      const shout = createShoutFx(ctx);
      const panner = createPanner(ctx);
      const gainNode = ctx.createGain();
      gainNode.gain.value = 0;

      input.connect(dry).connect(panner);
      input.connect(shout.input);
      shout.output.connect(wet).connect(panner);
      panner.connect(gainNode).connect(ctx.destination);

      chain = { input, dry, wet, panner, gainNode, nextPlayTime: 0, volume: null, mode: 'normal' };
      state.relayPeers.set(actorId, chain);
      const pos = state.peerPositions.get(actorId);
      if (pos) setPannerPosition(chain, pos);
    }
    return chain;
  }

  function setChainMode(chain, mode) {
    if (chain.mode === mode) return;
    chain.mode = mode;
    const ctx = ensureAudioContext();
    const shouting = mode === 'shout';
    chain.dry.gain.setTargetAtTime(shouting ? 0 : 1, ctx.currentTime, FX_SWITCH_S);
    chain.wet.gain.setTargetAtTime(shouting ? 1 : 0, ctx.currentTime, FX_SWITCH_S);
  }

  function decodeRelayFrame(b64) {
    const bin = atob(b64);
    const samples = bin.length >> 1;
    const pcm = new Float32Array(samples);
    for (let i = 0; i < samples; i++) {
      const lo = bin.charCodeAt(i * 2);
      const hi = bin.charCodeAt(i * 2 + 1);
      const signed = ((hi << 8) | lo) << 16 >> 16;
      pcm[i] = signed / 32768;
    }
    return pcm;
  }

  function playRelayFrame(fromActorId, volume, b64, mode) {
    if (typeof b64 !== 'string' || !b64.length) return;

    let pcm;
    try {
      pcm = decodeRelayFrame(b64);
    } catch (err) {
      console.error('[voip] audio_frame ilegível:', err);
      return;
    }
    if (!pcm.length) return;

    const ctx = ensureAudioContext();
    const chain = getRelayChain(fromActorId);
    setChainMode(chain, mode || 'normal');

    const volumeMudou = volume !== chain.volume;
    if (volumeMudou) {
      chain.volume = volume;
      chain.gainNode.gain.setTargetAtTime(volume, ctx.currentTime, 0.1);
    }

    const buffer = ctx.createBuffer(1, pcm.length, RELAY_SAMPLE_RATE);
    buffer.getChannelData(0).set(pcm);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(chain.input);

    const now = ctx.currentTime;
    if (chain.nextPlayTime < now || chain.nextPlayTime > now + RELAY_MAX_QUEUE_S) {
      chain.nextPlayTime = now + RELAY_JITTER_S;
    }
    source.start(chain.nextPlayTime);
    chain.nextPlayTime += buffer.duration;

    if (volumeMudou) updatePeerHUD(fromActorId, volume, false);

    if (!state.relayHeard) {
      state.relayHeard = true;
    }
  }

  function removeRelayPeer(actorId) {
    const chain = state.relayPeers.get(actorId);
    if (!chain) return;
    for (const node of [chain.input, chain.dry, chain.wet, chain.panner, chain.gainNode]) {
      try { node.disconnect(); } catch { /* contexto já fechado */ }
    }
    state.relayPeers.delete(actorId);
    state.peerPositions.delete(actorId);
  }

  async function initiateCall(targetActorId) {
    const pc = createPeerConnection(targetActorId);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal({ type: 'offer', targetActorId, sdp: offer.sdp });
  }

  async function handleOffer(fromActorId, sdp) {
    const pc = createPeerConnection(fromActorId);
    await pc.setRemoteDescription({ type: 'offer', sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal({ type: 'answer', targetActorId: fromActorId, sdp: answer.sdp });
  }

  function createPeerConnection(remoteActorId) {
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    if (state.localStream) {
      state.localStream.getTracks().forEach(track => pc.addTrack(track, state.localStream));
    }

    pc.onicecandidate = (e) => {
      if (e.candidate) {
        sendSignal({ type: 'ice', targetActorId: remoteActorId, candidate: e.candidate });
      }
    };

    pc.ontrack = (e) => {
      if (!state.audioCtx) return;
      const gainNode = state.audioCtx.createGain();
      gainNode.gain.value = 0;
      const source = state.audioCtx.createMediaStreamSource(new MediaStream([e.track]));
      source.connect(gainNode);
      gainNode.connect(state.audioCtx.destination);

      if (state.peers.has(remoteActorId)) {
        state.peers.get(remoteActorId).gainNode = gainNode;
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        removePeer(remoteActorId);
      }
    };

    state.peers.set(remoteActorId, { pc, gainNode: null });
    return pc;
  }

  function removePeer(actorId) {
    const peer = state.peers.get(actorId);
    if (peer) {
      peer.pc.close();
      state.peers.delete(actorId);
    }
    removeRelayPeer(actorId);
    removePeerHUD(actorId);
  }

  function sendSignal(msg) {
    if (state.ws && state.ws.readyState === WebSocket.OPEN) {
      state.ws.send(JSON.stringify({ ...msg, fromActorId: state.actorId }));
    }
  }

  function updatePeerHUD(actorId, volume, muted) {
    let el = document.getElementById(`peer-${actorId}`);
    if (!el) {
      el = document.createElement('div');
      el.id = `peer-${actorId}`;
      el.className = 'voip-peer';
      el.innerHTML = `
        <div class="icon"></div>
        <span class="peer-name">Jogador</span>
        <div class="vol-bar"><div class="vol-fill" style="width:0%"></div></div>
      `;
      document.getElementById('voip-hud').appendChild(el);
    }
    el.classList.toggle('muted', muted);
    el.querySelector('.vol-fill').style.width = `${Math.round(volume * 100)}%`;
  }

  function removePeerHUD(actorId) {
    const el = document.getElementById(`peer-${actorId}`);
    if (el) el.remove();
  }

  function setStatus(type, text) {
    const el = document.getElementById('voip-status');
    if (type === 'ok') {
      el.classList.add('visible');
    } else {
      el.classList.remove('visible');
    }
  }

  function setSenderStatus(active) {
    const el = document.getElementById('voip-status');
    el.classList.toggle('visible', !!active);
  }
  window.setSenderStatus = setSenderStatus;

  // Segurar-pra-falar (tecla V, via VoipToggleService). O helper transmite o
  // tempo todo; é este sinal que faz o servidor repassar ou descartar a voz.
  function setPushToTalk(talking) {
    state.talking = !!talking;
    sendSignal({ type: 'ptt', talking: state.talking });
    setSenderStatus(state.talking);
  }
  window.setPushToTalk = setPushToTalk;

  // Pop-up de acesso encerrado (AccessRevokedService). textContent, não
  // innerHTML: o motivo vem do banco e é digitado pela staff.
  function showAccessRevoked(reason) {
    document.getElementById('access-revoked-reason').textContent = reason || 'Seu acesso ao servidor foi encerrado.';
    document.getElementById('access-revoked').classList.add('visible');
    // O jogador perdeu o acesso: para de transmitir a voz na hora.
    if (state.talking) setPushToTalk(false);
    const button = document.getElementById('access-revoked-confirm');
    button.focus();
  }
  window.showAccessRevoked = showAccessRevoked;

  // Pop-up de servidor fora do ar (ServerDownService).
  //   lost       — acabou de cair
  //   connecting — tentando reconectar (botões travados)
  //   failed     — a tentativa falhou, servidor ainda fora
  const SERVER_DOWN_TEXT = {
    lost: 'A conexão com o servidor caiu. Você pode tentar reconectar ou fechar o jogo.',
    connecting: 'Reconectando ao servidor...',
    failed: 'O servidor ainda está indisponível. Tente novamente em instantes.'
  };

  function showServerDown(stateName) {
    const text = SERVER_DOWN_TEXT[stateName] || SERVER_DOWN_TEXT.lost;
    const connecting = stateName === 'connecting';
    document.getElementById('server-down-message').textContent = text;
    document.getElementById('server-down-reconnect').disabled = connecting;
    document.getElementById('server-down-reconnect').textContent = connecting ? 'Reconectando...' : 'Reconectar';
    document.getElementById('server-down').classList.add('visible');
    // Sem servidor não há para quem falar: solta a tecla da voz.
    if (state.talking) setPushToTalk(false);
    if (!connecting) document.getElementById('server-down-reconnect').focus();
  }
  window.showServerDown = showServerDown;

  function hideServerDown() {
    document.getElementById('server-down').classList.remove('visible');
  }
  window.hideServerDown = hideServerDown;

  function sendToGame(message) {
    if (window.skyrimPlatform && typeof window.skyrimPlatform.sendMessage === 'function') {
      window.skyrimPlatform.sendMessage(message);
    }
  }

  document.getElementById('server-down-reconnect').addEventListener('click', () => {
    showServerDown('connecting');
    sendToGame('cef::serverDown:reconnect');
  });

  document.getElementById('server-down-close').addEventListener('click', () => {
    document.getElementById('server-down-reconnect').disabled = true;
    document.getElementById('server-down-close').disabled = true;
    document.getElementById('server-down-close').textContent = 'Fechando...';
    sendToGame('cef::serverDown:close');
  });

  document.getElementById('access-revoked-confirm').addEventListener('click', () => {
    const button = document.getElementById('access-revoked-confirm');
    button.disabled = true;
    button.textContent = 'Fechando...';
    if (window.skyrimPlatform && typeof window.skyrimPlatform.sendMessage === 'function') {
      window.skyrimPlatform.sendMessage('cef::accessRevoked:confirm');
    }
  });

  function toggleMute() {
    state.muted = !state.muted;
    if (state.localStream) {
      state.localStream.getAudioTracks().forEach(t => t.enabled = !state.muted);
    }
    sendSignal({ type: 'mute', muted: state.muted });
    mp.trigger('cef::voip:mute_changed', { muted: state.muted });
  }

  function setVoiceMode(mode) {
    state.voiceMode = mode;
    sendSignal({ type: 'voice_mode', mode });
  }

  let _lastModalSentAt = 0;
  window.handleServerModal = (payload) => {
    const message = normalizePayload(payload);
    if (message && message.sentAt && message.sentAt === _lastModalSentAt) {
      return;
    }
    if (message && message.sentAt) {
      _lastModalSentAt = message.sentAt;
    }

    // if (message.type === 'governance:toast' || message.type === 'toast') {
    //   showInteractionToast(message.data && message.data.message ? message.data.message : 'Atualizado.');
    // }
  };

  let _lastVoipTicketSentAt = 0;
  window.handleVoipTicket = (payload) => {
    const msg = normalizePayload(payload);

    if (msg && msg.sentAt && msg.sentAt === _lastVoipTicketSentAt) {
      return;
    }
    if (msg && msg.sentAt) {
      _lastVoipTicketSentAt = msg.sentAt;
    }

    if (!msg || !msg.actorId || !msg.ticket) return;

    // Não descarta mais ticket "velho" comparando com o relógio local: isso
    // compara o relógio deste PC com o do servidor, e com mais de 30s de
    // diferença TODO ticket era ignorado em silêncio — a pessoa nunca ouvia
    // ninguém. Ticket vencido de verdade o servidor recusa (auth_failed), e
    // aí a reconexão pede outro.
    connectVoip(msg.actorId, msg.ticket, msg.host, msg.port);
  };

  if (mp && mp.events) {
    mp.events.add('voip:mute', () => toggleMute());
    mp.events.add('voip:setMode', (data) => {
      const d = typeof data === 'string' ? JSON.parse(data) : data;
      setVoiceMode(d.mode);
    });
  }

  const VOICE_RANGE_LEVELS = ['whisper', 'normal', 'shout'];
 
  function updateRangeBar() {
    const idx = VOICE_RANGE_LEVELS.indexOf(state.voiceMode);
    const level = idx === -1 ? 1 : idx;
    const segments = document.querySelectorAll('#voip-range-bar .range-segment');
    segments.forEach((seg, i) => {
      seg.classList.toggle('active', i <= level);
    });
  }
 
  function cycleVoiceRange() {
    const currentIdx = VOICE_RANGE_LEVELS.indexOf(state.voiceMode);
    const nextIdx = (currentIdx === -1 ? 1 : currentIdx + 1) % VOICE_RANGE_LEVELS.length;
    setVoiceMode(VOICE_RANGE_LEVELS[nextIdx]);
    updateRangeBar();
  }
  window.cycleVoiceRange = cycleVoiceRange;
